<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Street Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD pinned to safe-area corners, thumb controls at the bottom. Single dark "dashboard glass" look. */
:root{
  --bg:#0a0d12; --fg:#f3f5f7; --muted:#a9b3bf; --accent:#ff7a1a; --glass:rgba(12,16,22,.46); --line:rgba(255,255,255,.22);
  --danger:#ff4a3d; --good:#5fe3a1;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif; --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font-family:var(--display);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#score{top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));font-size:15px;letter-spacing:.06em}
#score b{display:block;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#mini{top:calc(84px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:112px;height:112px;border-radius:50%;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#speedo{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#speedo .v{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#speedo .u{font-size:12px;letter-spacing:.2em;color:var(--muted)}
#speedo .g{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--accent)}
#msg{top:28%;left:0;right:0;text-align:center;font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--accent);opacity:0;transition:opacity .25s, transform .25s;transform:scale(.9)}
#msg.on{opacity:1;transform:scale(1)}
#msg small{display:block;font-size:16px;color:var(--fg);letter-spacing:.12em}
#drift{top:36%;left:0;right:0;text-align:center;font-size:20px;color:var(--fg);opacity:0;transition:opacity .2s}
#drift.on{opacity:1}
#topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:44px}
.tb:focus-visible,.pad:focus-visible,#go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls{position:fixed;left:0;right:0;bottom:0;height:0}
.pad{position:fixed;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1.5px solid var(--line);color:var(--fg);
  font-family:var(--display);font-weight:700;letter-spacing:.06em;border-radius:50%;width:76px;height:76px;font-size:14px;touch-action:none;padding:0}
.pad.on{background:rgba(255,122,26,.42);border-color:var(--accent)}
.pad svg{width:34px;height:34px;fill:currentColor}
#left{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#right{left:calc(max(16px,env(safe-area-inset-left,0px)) + 88px);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#gas{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:78px;height:118px;border-radius:22px}
#brake{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#hb{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(100px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:12px}
@media (pointer:fine){ #controls{display:none} }
@media (pointer:coarse){ .keys{display:none} }
@media (max-width:560px){ #topbtns{flex-direction:column} }
[hidden]{display:none!important}
body.menu .hud, body.menu #topbtns, body.menu #controls{display:none!important}
/* studio intro */
#intro{position:fixed;inset:0;z-index:30;background:#06080b;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.emblem{width:84px;height:84px;color:var(--accent);opacity:0;transform:scale(.3) rotate(-300deg);animation:emb .9s cubic-bezier(.2,.9,.25,1.15) 1.25s forwards}
.wordmark{font-family:var(--display);font-weight:700;font-size:clamp(30px,8.5vw,64px);letter-spacing:.08em;line-height:1;color:var(--fg);white-space:nowrap;clip-path:inset(0 100% 0 0);animation:wipe 1.05s cubic-bezier(.55,0,.35,1) .25s forwards}
.wordmark span{color:var(--accent)}
.studio{font-family:var(--display);font-size:clamp(12px,3vw,16px);letter-spacing:.7em;margin-right:-.7em;color:var(--muted);opacity:0;transform:translateY(8px);animation:up .6s ease-out 1.55s forwards}
.track{position:absolute;left:50%;bottom:-40px;width:120vw;height:2px;transform:translateX(-50%)}
.trail{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent));transform-origin:left;transform:scaleX(0);animation:trail 1.05s cubic-bezier(.55,0,.35,1) .25s forwards,fade .7s ease-in 1.6s forwards}
.icar{position:absolute;bottom:-2px;left:0;width:132px;height:44px;transform:translateX(-140px);animation:drive 1.05s cubic-bezier(.55,0,.35,1) .25s forwards}
.icar .wh{transform-box:fill-box;transform-origin:center;animation:spin .16s linear infinite}
#intro .ld{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted);opacity:0;transition:opacity .3s}
#intro.wait .ld{opacity:1}
#intro.skip *{animation-delay:0s!important;animation-duration:.01s!important}
@keyframes drive{to{transform:translateX(120vw)}}
@keyframes trail{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes emb{to{opacity:1;transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
/* main menu */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,22px);text-align:center;overflow-y:auto;
  background:radial-gradient(120% 85% at 50% 100%,rgba(6,9,14,.3),rgba(6,9,14,.86));padding-block:max(20px,env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menu h1{font-family:var(--display);font-size:clamp(38px,9vw,72px);margin:0;letter-spacing:.04em;line-height:.95;text-wrap:balance}
#menu h1 span{color:var(--accent)}
.by{font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted);margin-top:8px}
.sel{font-family:var(--display);font-size:13px;letter-spacing:.32em;display:flex;align-items:center;gap:12px;width:min(640px,100%)}
.sel::before,.sel::after{content:"";flex:1;height:1px;background:var(--line)}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(640px,100%)}
.map{display:flex;flex-direction:column;text-align:left;padding:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(14,18,24,.78);color:var(--fg);font-family:var(--body);cursor:pointer;transition:transform .15s,border-color .15s}
.map:hover,.map:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.map:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.map[disabled]{opacity:.5;cursor:wait;transform:none}
.map svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.map .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.map b{font-family:var(--display);font-size:17px;letter-spacing:.04em}
.map small{color:var(--muted);font-size:12px;line-height:1.35}
.map .play{margin-top:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--accent)}
@media (max-height:480px){ #menu h1{font-size:32px} .map small{display:none} .maps{width:min(520px,100%)} .by{margin-top:4px} }
@media (prefers-reduced-motion:reduce){ #intro *{animation-duration:.01s!important;animation-delay:0s!important} .map{transition:none} }
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,214,150,.95),rgba(255,110,30,.85) 45%,rgba(120,24,10,.9));opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){#msg,#drift,#flash{transition:none}}
</style>

    const want = Math.atan2(dx, dz); let dA = want - camYaw; dA -= Math.PI * 2 * Math.round(dA / (Math.PI * 2));
    camYaw += dA * (1 - Math.exp(-5 * dt)); camDist = lerp(camDist, dist, 1 - Math.exp(-3 * dt));
    camPos.x = P.x - Math.sin(camYaw) * camDist; camPos.z = P.z - Math.cos(camYaw) * camDist;
    camPos.y = lerp(camPos.y, Math.max(P.y * .75, 0) + h + (P.air ? .8 : 0), 1 - Math.exp(-5 * dt));
    const fr = rayFree(P.x, P.z, camPos.x, camPos.z);
    if (fr < 1) { const k = Math.max(.12, fr - .6 / Math.max(camDist, 1)); camPos.x = P.x + (camPos.x - P.x) * k; camPos.z = P.z + (camPos.z - P.z) * k; camDist = Math.max(2, camDist * k); }
    camLook.set(P.x + fx * 3, P.y + .9, P.z + fz * 3);
  }
  camera.position.copy(camPos);
  if (game.shake > 0) { const s = game.shake * .35; camera.position.x += (Math.random() - .5) * s; camera.position.y += (Math.random() - .5) * s; game.shake = Math.max(0, game.shake - dt * 1.6); }
  if (speed > 45) { const s = (speed - 45) * .0012; camera.position.x += (Math.random() - .5) * s; camera.position.y += (Math.random() - .5) * s; }
  camera.lookAt(camLook);
  const fov = baseFov + clamp(speed - 10, 0, 70) * .22;
  if (Math.abs(camera.fov - fov) > .05) { camera.fov = lerp(camera.fov, fov, Math.min(1, dt * 3)); camera.updateProjectionMatrix(); }
  smokeSys.mat.uniforms.uScale.value = fireSys.mat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  // speed lines
  const op = clamp((speed - 38) / 45, 0, .35); lineMat.opacity = op; speedLines.visible = op > 0.01;
  if (speedLines.visible) {
    const len = speed * .05;
    for (let i = 0; i < LINES; i++) { const l = lineData[i]; l.z += speed * dt * 1.6; if (l.z > -2) l.z = -55 - Math.random() * 10;
      const o = i * 6; linePos[o] = linePos[o + 3] = l.x; linePos[o + 1] = linePos[o + 4] = l.y; linePos[o + 2] = l.z; linePos[o + 5] = l.z - len; }
    lineGeo.attributes.position.needsUpdate = true;
  }
}

// ------------------------------------------------------------------ main loop
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  baseFov = aspect >= 1 ? 58 : clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36)) / aspect)), 58, 84);
  camera.fov = baseFov; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
setQuality(quality);

let running = false, last = performance.now(), fpsAcc = 0, fpsN = 0, playT = 0, frameNo = 0;
let distShown = -1, hudT = 0, mmTick = 0;
const setText = (el, v) => { v = String(v); if (el._v !== v) { el._v = v; el.textContent = v; } };
function step(dt) {
  const r = updatePlayer(dt);
  updateTraffic(dt);
  updateSmoke(dt);
  updateShards(dt);
  updateBoom(dt);
  // car transforms
  hero.root.position.set(P.x, P.y, P.z); hero.root.rotation.y = P.yaw;
  hero.body.rotation.set(P.pitch, 0, P.roll); hero.body.position.y = P.susp;
  for (const w of hero.wheels) { w.spin.rotation.x = -P.wheel * (w.pivot.scale.x < 0 ? 1 : 1); if (w.front) w.pivot.rotation.y = -P.steer * .45 * (w.pivot.scale.x < 0 ? -1 : 1); }
  hero.shadow.position.y = gnd.h - P.y + .03; hero.shadow.material.opacity = clamp(.8 - (P.y - gnd.h) * .08, .15, .8);
  hero.tailMat.emissiveIntensity = input.brake ? 4 : 1.2;
  // world follow
  sun.position.set(P.x + sunDir.x * 120, P.y + sunDir.y * 120, P.z + sunDir.z * 120 - 15); sun.target.position.set(P.x, P.y, P.z - 15);
  sky.position.copy(camera.position);
  updateCamera(dt, r.speed);
  // score & hud
  game.dist += r.speed * dt / 1000;
  if ((++mmTick & 1) === 0) drawMinimap();
  if (!P.air && r.speed > 5) game.score += r.speed * dt * .5;
  setText(hud.spd, Math.round(Math.abs(r.vF) * 3.6));
  setText(hud.gear, r.vF < -0.5 ? 'R' : r.speed < .5 ? 'N' : gear);
  hudT -= dt; if (hudT <= 0) { hudT = .15; setText(hud.score, Math.floor(game.score).toLocaleString('en-US')); }
  const ds = Math.floor(game.dist * 10); if (ds !== distShown) { distShown = ds; hud.dist.textContent = (ds / 10).toFixed(1) + ' km'; }
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) hud.msg.classList.remove('on'); }
  if (hud.flash.style.opacity !== '' && hud.flash.style.opacity !== '0') { const v = Math.max(0, parseFloat(hud.flash.style.opacity) - dt * .8); hud.flash.style.opacity = v < .01 ? '0' : v.toFixed(2); }
  // audio
  if (audio) {
    const t = audio.ctx.currentTime, f = 42 + rpm * 200;
    audio.o1.frequency.setTargetAtTime(f, t, .04); audio.o2.frequency.setTargetAtTime(f * .5, t, .04);
    audio.lp.frequency.setTargetAtTime(380 + rpm * (input.gas ? 2200 : 1100), t, .05);
    audio.eg.gain.setTargetAtTime(input.gas ? .12 : .07, t, .1);
    audio.screech.gain.setTargetAtTime(r.drifting ? .06 + r.intensity * .12 : 0, t, .05);
    audio.wind.gain.setTargetAtTime(clamp(r.speed / 75, 0, 1) * .14, t, .1);
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.max(.001, (now - last) / 1000); last = now;
  if (dt > .1) dt = .1;
  if (running) {
    playT += dt;
    const ts = game.slow > 0 ? .35 : 1; if (game.slow > 0) game.slow -= dt;
    const n = dt > 1 / 50 ? 2 : 1; for (let i = 0; i < n; i++) step(dt * ts / n);
    // adaptive quality: after warmup, drop one level if the frame rate is poor
    // dynamic resolution: keep ~60 fps by trading pixels first, then effects
    if (playT > 1.5) { fpsAcc += dt; fpsN++;
      if (fpsAcc > 1.5) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
        if (fps < 50) {
          if (pr > prMin + .01) { pr = Math.max(prMin, pr - (fps < 38 ? .2 : .1)); renderer.setPixelRatio(pr); resize(); }
          else if (quality > 0 && fps < 42) { setQuality(quality - 1); popup('SMOOTH MODE', 'graphics lowered to remove lag'); }
        } else if (fps > 58 && pr < prMax - .01) { pr = Math.min(prMax, pr + .05); renderer.setPixelRatio(pr); resize(); }
      } }
  } else {
    // idle orbit behind the start screen
    playT += dt * .3;
    const a = playT * .6;
    camera.position.set(P.x + Math.sin(a) * 7, 1.6, P.z + Math.cos(a) * 7); camera.lookAt(P.x, .7, P.z);
    sky.position.copy(camera.position);
  }
  renderer.render(scene, camera);
}

// initial state
applyMap('village'); resetRun(); try { renderer.compile(scene, camera); } catch (_) {}
applyMap('city'); resetRun(); try { renderer.compile(scene, camera); renderer.render(scene, camera); } catch (_) {}
if (location.hash === '#debug') window.__br = { P, traffic, world, get nodes() { return nodes; }, get edges() { return edges; }, startGame: n => startGame(n), smash: (t, a, b, c) => smash(t, a, b, c) };
requestAnimationFrame(frame);

function resetRun() {
  Object.assign(P, { x: START.x, y: 0, z: START.z, yaw: START.yaw, rdx: 0, rdz: -1, vx: 0, vz: 0, vy: 0, steer: 0, air: false, airT: 0, slope: 0, pitch: 0, roll: 0, susp: 0, suspV: 0, wheel: 0, yawRate: 0 });
  Object.assign(game, { score: 0, dist: 0, drift: 0, driftT: 0, shake: 0, combo: 1, slow: 0 });
  uncrumple(hero.paintMesh); uncrumple(hero.glassMesh); hero.glassMesh.material = CAR.common.glass; hero.dents = 0;
  hero.root.position.set(P.x, P.y, P.z); hero.root.rotation.y = P.yaw;
  for (const t of traffic) { if (t.wreck) repairCar(t); t.active = false; t.car.root.visible = false; }
  for (let i = 0; i < MAPS[MAP].traffic; i++) spawnTraffic(traffic[i]);
  { const z = new THREE.Matrix4().makeScale(0, 0, 0); for (let i = 0; i < SKID_N; i++) skid.setMatrixAt(i, z); skid.instanceMatrix.needsUpdate = true; skidLast[0] = skidLast[1] = null; }
  for (const S of [smokeSys, fireSys]) { for (const p of S.p) p.age = p.life; S.alpha.fill(0); S.geo.attributes.aAlpha.needsUpdate = true; }
  { const z = new THREE.Matrix4().makeScale(0, 0, 0); for (let i = 0; i < SH_N; i++) { shardData[i].age = shardData[i].life; shardMesh.setMatrixAt(i, z); } shardMesh.instanceMatrix.needsUpdate = true; }
  boom.t = 9; boom.burn = null; boomLight.intensity = 0; ring.material.opacity = 0;
  camPos.set(P.x + Math.sin(P.yaw) * 8, 3, P.z + Math.cos(P.yaw) * 8); camYaw = P.yaw + Math.PI; camDist = 7; distShown = -1;
  hud.msg.classList.remove('on'); hud.drift.classList.remove('on'); hud.flash.style.opacity = '0';
  sun.position.set(P.x + sunDir.x * 120, sunDir.y * 120, P.z + sunDir.z * 120); sun.target.position.set(P.x, 0, P.z);
  updateTraffic(0);
}
function startGame(name) {
  if (name !== MAP) applyMap(name); resetRun();
  $('menu').hidden = true; document.body.classList.remove('menu');
  if (!audio) initAudio(); else audio.ctx.resume();
  running = true; last = performance.now(); playT = 0; fpsAcc = 0; fpsN = 0;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
  popup(MAPS[name].name, 'hold GAS · tap DRIFT in corners');
}
function openMenu() {
  running = false; for (const k in input) input[k] = false;
  document.querySelectorAll('.pad.on').forEach(e => e.classList.remove('on'));
  $('menu').hidden = false; document.body.classList.add('menu'); if (audio) audio.ctx.suspend();
  $(MAP === 'city' ? 'mapCity' : 'mapVillage').focus({ preventScroll: true });
}
$('mapCity').onclick = () => startGame('city');
$('mapVillage').onclick = () => startGame('village');
$('menuBtn').onclick = openMenu;
$('mapCity').disabled = $('mapVillage').disabled = false;
function showMenu() { $('menu').hidden = false; document.body.classList.add('menu'); $('intro').classList.add('out'); setTimeout(() => { $('intro').hidden = true; }, 600); }
if (window.__introDone) showMenu(); else document.addEventListener('introdone', showMenu, { once: true });
document.addEventListener('visibilitychange', () => { if (audio) { document.hidden || !running ? audio.ctx.suspend() : audio.ctx.resume(); } });
</script>
