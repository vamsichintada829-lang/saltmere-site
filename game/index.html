<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Street Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD pinned to safe-area corners, thumb controls at the bottom. Single dark "dashboard glass" look. */
:root{
  --bg:#0a0d12; --fg:#f3f5f7; --muted:#a9b3bf; --accent:#ff7a1a; --glass:rgba(12,16,22,.46); --line:rgba(255,255,255,.22);
  --danger:#ff4a3d; --good:#5fe3a1;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif; --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font-family:var(--display);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#score{top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));font-size:15px;letter-spacing:.06em}
#score b{display:block;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#speedo{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#speedo .v{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#speedo .u{font-size:12px;letter-spacing:.2em;color:var(--muted)}
#speedo .g{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--accent)}
#msg{top:28%;left:0;right:0;text-align:center;font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--accent);opacity:0;transition:opacity .25s, transform .25s;transform:scale(.9)}
#msg.on{opacity:1;transform:scale(1)}
#msg small{display:block;font-size:16px;color:var(--fg);letter-spacing:.12em}
#drift{top:36%;left:0;right:0;text-align:center;font-size:22px;font-weight:700;letter-spacing:.08em;color:#fff;opacity:0;transition:opacity .2s,transform .15s;transform:scale(var(--k,1));text-shadow:0 0 12px rgba(255,140,40,.9),0 2px 4px rgba(0,0,0,.7)}
#drift.on{animation:driftPulse .45s ease-in-out infinite alternate}
@keyframes driftPulse{from{color:#fff}to{color:#ffd23f}}
#drift.on{opacity:1}
#topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:44px}
.tb:focus-visible,.pad:focus-visible,#go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls{position:fixed;left:0;right:0;bottom:0;height:0}
.pad{position:fixed;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1.5px solid var(--line);color:var(--fg);
  font-family:var(--display);font-weight:700;letter-spacing:.06em;border-radius:50%;width:76px;height:76px;font-size:14px;touch-action:none;padding:0}
.pad.on{background:rgba(255,122,26,.42);border-color:var(--accent)}
.pad svg{width:34px;height:34px;fill:currentColor}
#left{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#right{left:calc(max(16px,env(safe-area-inset-left,0px)) + 88px);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#gas{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:78px;height:118px;border-radius:22px}
#brake{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#hb{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(100px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:12px}
@media (pointer:fine){ #controls{display:none} }
@media (pointer:coarse){ .keys{display:none} }
@media (max-width:560px){ #topbtns{flex-direction:column} }
[hidden]{display:none!important}
body.menu .hud, body.menu #topbtns, body.menu #controls{display:none!important}
/* studio intro */
#intro{position:fixed;inset:0;z-index:30;background:#06080b;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.emblem{width:84px;height:84px;color:var(--accent);opacity:0;transform:scale(.3) rotate(-300deg);animation:emb .9s cubic-bezier(.2,.9,.25,1.15) 1.25s forwards}
.wordmark{font-family:var(--display);font-weight:700;font-size:clamp(30px,8.5vw,64px);letter-spacing:.08em;line-height:1;color:var(--fg);white-space:nowrap;clip-path:inset(0 100% 0 0);animation:wipe 1.05s cubic-bezier(.55,0,.35,1) .25s forwards}
.wordmark span{color:var(--accent)}
.studio{font-family:var(--display);font-size:clamp(12px,3vw,16px);letter-spacing:.7em;margin-right:-.7em;color:var(--muted);opacity:0;transform:translateY(8px);animation:up .6s ease-out 1.55s forwards}
.track{position:absolute;left:50%;bottom:-40px;width:120vw;height:2px;transform:translateX(-50%)}
.trail{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent));transform-origin:left;transform:scaleX(0);animation:trail 1.05s cubic-bezier(.55,0,.35,1) .25s forwards,fade .7s ease-in 1.6s forwards}
.icar{position:absolute;bottom:-2px;left:0;width:132px;height:44px;transform:translateX(-140px);animation:drive 1.05s cubic-bezier(.55,0,.35,1) .25s forwards}
.icar .wh{transform-box:fill-box;transform-origin:center;animation:spin .16s linear infinite}
#intro .ld{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted);opacity:0;transition:opacity .3s}
#intro.wait .ld{opacity:1}
#intro.skip *{animation-delay:0s!important;animation-duration:.01s!important}
@keyframes drive{to{transform:translateX(120vw)}}
@keyframes trail{to{transform:scaleX(1)}}
@keyframes fade{to{opacity:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes emb{to{opacity:1;transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
/* main menu */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(12px,3vh,22px);text-align:center;overflow-y:auto;
  background:radial-gradient(120% 85% at 50% 100%,rgba(6,9,14,.3),rgba(6,9,14,.86));padding-block:max(20px,env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menu h1{font-family:var(--display);font-size:clamp(38px,9vw,72px);margin:0;letter-spacing:.04em;line-height:.95;text-wrap:balance}
#menu h1 span{color:var(--accent)}
.by{font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted);margin-top:8px}
.sel{font-family:var(--display);font-size:13px;letter-spacing:.32em;display:flex;align-items:center;gap:12px;width:min(640px,100%)}
.sel::before,.sel::after{content:"";flex:1;height:1px;background:var(--line)}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(640px,100%)}
.map{display:flex;flex-direction:column;text-align:left;padding:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(14,18,24,.78);color:var(--fg);font-family:var(--body);cursor:pointer;transition:transform .15s,border-color .15s}
.map:hover,.map:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.map:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.map[disabled]{opacity:.5;cursor:wait;transform:none}
.map svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.map .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.map b{font-family:var(--display);font-size:17px;letter-spacing:.04em}
.map small{color:var(--muted);font-size:12px;line-height:1.35}
.map .play{margin-top:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--accent)}
@media (max-height:480px){ #menu h1{font-size:32px} .map small{display:none} .maps{width:min(520px,100%)} .by{margin-top:4px} }
#hudL{top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#board{display:flex;flex-direction:column;gap:4px;font-size:14px}
#board .row{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:3px 10px 3px 6px;min-width:128px}
#board .row.me{border-color:rgba(255,255,255,.7)}
#board .dot{width:12px;height:12px;border-radius:3px;flex:none}
#board .nm{flex:1;min-width:0;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .pt{font-variant-numeric:tabular-nums;font-weight:700}
#board .fl{color:#ffd23f;font-size:13px}
#mini{width:112px;height:112px;border-radius:50%;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#obj{top:calc(74px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:14px;letter-spacing:.14em}
#obj b{color:#ffd23f;font-weight:700}
#count{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;font-family:var(--display);text-shadow:0 2px 12px rgba(0,0,0,.6)}
#count .n{font-size:min(30vw,170px);font-weight:700;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
#count .l{font-size:16px;letter-spacing:.24em;color:var(--muted)}
.view{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(660px,100%)}
.field{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:12px;letter-spacing:.24em;color:var(--muted);text-align:left}
.field input,.join input{font:600 18px var(--body);color:var(--fg);background:rgba(14,18,24,.8);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:min(320px,82vw)}
.field input:focus-visible,.join input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bigrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.bigbtn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(14,18,24,.8);color:var(--fg);cursor:pointer;min-width:0}
.bigbtn b{font-family:var(--display);font-size:20px;letter-spacing:.08em}
.bigbtn small{color:var(--muted);font-size:13px;line-height:1.35}
.bigbtn.hot{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,122,26,.28),rgba(14,18,24,.85))}
.bigbtn.wide{width:min(420px,100%)}
.bigbtn:hover,.bigbtn:focus-visible{transform:translateY(-2px)}
.bigbtn:focus-visible,.ghost:focus-visible,.primary:focus-visible,.join button:focus-visible,.cbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bigbtn[disabled],.primary[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.or{font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted)}
.join{display:flex;gap:8px}
.join input{width:min(200px,50vw);text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);text-align:center}
.join button,.cbtns button{font-family:var(--display);font-weight:700;letter-spacing:.12em;color:#160a02;background:var(--accent);border:0;border-radius:10px;padding:0 18px;min-height:44px;cursor:pointer}
.ghost,.primary{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;border-radius:10px;padding:12px 22px;min-height:46px;cursor:pointer}
.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.primary{background:var(--accent);color:#160a02;border:0}
.status{margin:0;min-height:1.3em;color:var(--muted);font-size:14px;max-width:46ch}
.status.err{color:#ff8a7a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;width:100%;align-items:start}
.lcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.codebox{display:flex;flex-direction:column;gap:6px;align-items:center;padding:12px;border:1.5px dashed var(--accent);border-radius:14px;background:rgba(14,18,24,.8)}
.codebox span{font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted)}
.codebox b{font-family:var(--display);font-size:34px;letter-spacing:.24em;color:var(--fg);user-select:text;-webkit-user-select:text}
.cbtns{display:flex;gap:8px}
.cbtns button{min-height:38px;padding:0 14px;font-size:13px}
#lplayers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
#lplayers li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(14,18,24,.8);border:1px solid var(--line);font-weight:600}
#lplayers li i{width:14px;height:14px;border-radius:4px;flex:none}
#lplayers li em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:11px;letter-spacing:.16em;color:var(--muted)}
#lplayers li.empty{color:var(--muted);font-weight:400;border-style:dashed}
.lrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.map.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.maps[data-locked] .map{cursor:default}
.overlay{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(6,9,14,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px;border-radius:16px;background:rgba(14,18,24,.92);border:1px solid var(--line);width:min(440px,100%);text-align:center}
.panel h2{margin:0;font-family:var(--display);font-size:34px;letter-spacing:.08em}
#rList{margin:0;padding:0;list-style:none;width:100%;display:flex;flex-direction:column;gap:6px}
#rList li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.05)}
#rList li i{width:14px;height:14px;border-radius:4px}
#rList li b{margin-left:auto;font-family:var(--display);font-size:18px}
@media (max-width:620px){ .lobby{grid-template-columns:minmax(0,1fr)} .bigrow{grid-template-columns:minmax(0,1fr)} }
@media (max-height:480px){ body.sub #menu .brand{display:none} body.sub #menu .keys{display:none} .bigbtn{padding:12px} .codebox b{font-size:26px} .map small{display:none} }
@media (max-height:480px) and (min-width:621px){ .lobby{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)} }

@media (prefers-reduced-motion:reduce){ #intro *{animation-duration:.01s!important;animation-delay:0s!important} .map{transition:none} }
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,214,150,.95),rgba(255,110,30,.85) 45%,rgba(120,24,10,.9));opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){#msg,#drift,#flash{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="hudL"><div id="board"></div><canvas id="mini" width="112" height="112" aria-label="Map"></canvas></div>
<div class="hud" id="obj"></div>
<div class="hud" id="count"></div>
<div class="hud" id="speedo"><div class="v" id="spd">0</div><div class="u">KM/H <span class="g" id="gear">N</span></div></div>
<div class="hud" id="msg"></div>
<div class="hud" id="drift"></div>
<div id="flash"></div>
<div id="topbtns">
  <button class="tb" id="menuBtn" type="button" aria-label="Main menu">MENU</button>
  <button class="tb" id="camBtn" type="button" aria-label="Change camera">CAM</button>
  <button class="tb" id="qBtn" type="button" aria-label="Graphics quality">HD</button>
  <button class="tb" id="sndBtn" type="button" aria-label="Sound on or off">SND</button>
</div>
<div id="controls">
  <button class="pad" id="left" type="button" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
  <button class="pad" id="right" type="button" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8L7 18.4 13.8 12 7 5.6z"/></svg></button>
  <button class="pad" id="hb" type="button" aria-label="Handbrake drift">DRIFT</button>
  <button class="pad" id="brake" type="button" aria-label="Brake">BRAKE</button>
  <button class="pad" id="gas" type="button" aria-label="Accelerate">GAS</button>
</div>
<div id="menu" hidden>
  <div class="brand"><h1>STREET <span>RUSH</span></h1><div class="by">WHEEL SMART STUDIO · CAPTURE THE FLAG</div></div>
  <section class="view" id="vHome">
    <label class="field" for="pname"><span>YOUR NAME</span><input id="pname" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <div class="bigrow">
      <button class="bigbtn" id="bSolo" type="button" disabled><b>SOLO DRIFT</b><small>Practice alone: grab the flag, bring it home</small></button>
      <button class="bigbtn hot" id="bTeam" type="button" disabled><b>TEAM CODE</b><small>Invite friends and play online</small></button>
    </div>
    <p class="status" id="homeStatus"></p>
  </section>
  <section class="view" id="vSolo" hidden>
    <div class="sel">SELECT MAP</div>
    <div class="maps" data-maps="solo"></div>
    <button class="ghost" type="button" data-back>BACK</button>
  </section>
  <section class="view" id="vTeam" hidden>
    <button class="bigbtn hot wide" id="bCreate" type="button"><b>CREATE TEAM</b><small>You get a team code to send to your friends</small></button>
    <div class="or">OR</div>
    <div class="join"><label class="sr" for="jcode">Team code</label><input id="jcode" maxlength="6" placeholder="TEAM CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="bJoin" type="button">JOIN</button></div>
    <p class="status" id="teamStatus"></p>
    <button class="ghost" type="button" data-back>BACK</button>
  </section>
  <section class="view" id="vLobby" hidden>
    <div class="lobby">
      <div class="lcol">
        <div class="codebox"><span>TEAM CODE</span><b id="lcode">------</b><div class="cbtns"><button id="bCopy" type="button">COPY</button><button id="bShare" type="button">SHARE</button></div></div>
        <ul id="lplayers"></ul>
        <p class="status" id="lstatus"></p>
      </div>
      <div class="lcol">
        <div class="sel">MAP</div>
        <div class="maps" data-maps="lobby"></div>
        <div class="lrow"><button class="ghost" id="bLeave" type="button">LEAVE</button><button class="primary" id="bStart" type="button">START</button></div>
      </div>
    </div>
  </section>
  <div class="keys">Keyboard: ↑ gas · ↓ brake · ← → steer · Space drift · C camera · Esc pause</div>
</div>
<template id="mapCards">
  <button class="map" data-map="city" type="button">
    <svg viewBox="0 0 160 90" aria-hidden="true"><rect width="160" height="90" fill="#b9b5ad"/><path fill="#45474b" d="M0 34h160v16H0zM0 74h160v16H0zM28 0h16v90H28zM116 0h16v90h-16z"/><path stroke="#f0c040" stroke-width="1" d="M0 42h160M0 82h160M36 0v90M124 0v90"/><circle cx="80" cy="62" r="7" fill="none" stroke="#eee" stroke-width="1.2"/><path stroke="#fff" stroke-width="1.4" d="M80 50v12"/><path fill="#ffd23f" d="M80 50l9 3-9 3z"/><circle cx="36" cy="82" r="5" fill="#ff6a0a" opacity=".85"/><circle cx="124" cy="42" r="5" fill="#2f7bff" opacity=".85"/></svg>
    <span class="info"><b>City Streets</b><small>Tar road grid. Flag in the centre circle.</small><span class="play">PLAY ›</span></span>

  if (NET.mode === 'relay') { if (NET.mq) NET.mq.publish(NET.base + (m.t === 'st' ? '/s' : '/g'), m); return; }
  for (const c of NET.conns) if (c !== except && c.open) c.send(m);
}
function claim(type) { if (!MT.online || NET.isHost) hostClaim(type, MT.mySlot); else send({ t: type }); }
function sendLobby() { bcast({ t: 'lobby', players: LOBBY.players, map: LOBBY.map, code: NET.code }); }
async function connectRelay() { const mq = new MiniMqtt(RELAYS[0], 'sr-' + myId + '-' + genCode().toLowerCase()); await mq.connect(9000); return mq; }
async function relayDropped() {
  for (let k = 0; k < 4 && NET.mode === 'relay'; k++) {
    await sleep(1500);
    try { const old = NET.mq, mq = await connectRelay(); if (NET.mode !== 'relay') { mq.close(); return; } for (const [t, fn] of old.subs) mq.subscribe(t, fn); mq.onclose = relayDropped; NET.mq = mq; return; } catch (_) {}
  }
  if (NET.mode !== 'relay') return;
  if (NET.isHost) { const wasMatch = MT.active; netReset(); if (wasMatch) endMatch(); running = false; $('result').hidden = true; $('pause').hidden = true; openMainMenu(); status('homeStatus', 'Lost the connection to the game server.', true); }
  else hostLost();
}
async function createTeam() {
  status('teamStatus', 'Creating team…'); $('bCreate').disabled = true;
  try {
    netReset();
    const code = genCode(); let mq = null;
    try { mq = await connectRelay(); } catch (_) {}
    if (mq) {
      Object.assign(NET, { mode: 'relay', mq, base: TOPIC(code), code, isHost: true, online: true, conns: [] });
      mq.subscribe(NET.base + '/h', onRelayHost);
      mq.subscribe(NET.base + '/s', m => { if (!m || typeof m !== 'object') return; onState(m); const c = NET.conns.find(c => c.slot === m.s); if (c) c.seen = nowS(); });
      mq.onclose = relayDropped;
    } else {
      const Peer = await getPeer(); let r = null;
      for (let k = 0; k < 3 && !r; k++) {
        const pc = k ? genCode() : code;
        r = await new Promise((res, rej) => {
          const p = new Peer(PEER_PREFIX + pc, { config: ICE, debug: 0 });
          const to = setTimeout(() => { p.destroy(); rej({ type: 'network' }); }, 15000);
          p.on('open', () => { clearTimeout(to); res({ p, code: pc }); });
          p.on('error', e => { clearTimeout(to); p.destroy(); e.type === 'unavailable-id' ? res(null) : rej(e); });
        });
      }
      if (!r) throw { type: 'unavailable-id' };
      Object.assign(NET, { mode: 'p2p', peer: r.p, code: r.code, isHost: true, online: true, conns: [] });
      r.p.on('connection', onGuestConn);
      r.p.on('disconnected', () => { try { r.p.reconnect(); } catch (_) {} });
      r.p.on('error', e => { if (e.type !== 'peer-unavailable') console.warn('peer', e.type); });
    }
    LOBBY.players = [{ id: myId, name: myName(), slot: 0 }]; LOBBY.mySlot = 0; LOBBY.map = LOBBY.map || 'city';
    status('teamStatus', ''); showView('vLobby'); renderLobby();
  } catch (e) { status('teamStatus', netError(e), true); netReset(); }
  $('bCreate').disabled = false;
}
function onRelayHost(m) {
  if (!m || typeof m !== 'object' || typeof m.from !== 'string') return;
  let c = NET.conns.find(c => c.pid === m.from);
  if (!c) { if (m.t !== 'hello') return; const pid = m.from.slice(0, 12); c = { pid, open: true, relay: true, seen: nowS(), send: x => NET.mq && NET.mq.publish(NET.base + '/p/' + pid, x), close() {} }; }
  c.seen = nowS();
  onHostData(c, m);
}
function onGuestConn(conn) {
  conn.on('data', m => onHostData(conn, m));
  conn.on('close', () => guestLeft(conn));
  conn.on('error', () => guestLeft(conn));
}
function onHostData(conn, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello') {
    if (conn.slot !== undefined) { sendLobby(); return; }
    if (LOBBY.players.length >= 4 || MT.active) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 400); return; }
    const used = LOBBY.players.map(p => p.slot); let slot = 0; while (used.includes(slot)) slot++;
    conn.slot = slot; conn.pid = conn.pid || String(m.id).slice(0, 12); NET.conns.push(conn);
    LOBBY.players.push({ id: String(m.id).slice(0, 12), name: cleanName(m.name), slot }); sendLobby(); renderLobby(); tone(880, .15, .2); return;
  }
  if (conn.slot === undefined) return;
  if (m.t === 'st') { m.s = conn.slot; bcast(m, conn); onState(m); const r = remotes.get(conn.slot); if (r) r.seen = nowS(); }
  else if (m.t === 'ready') conn.ready = true;
  else if (m.t === 'pick' || m.t === 'steal' || m.t === 'cap') hostClaim(m.t, conn.slot);
  else if (m.t === 'bye') guestLeft(conn);
}
function guestLeft(conn) {
  if (!NET.conns.includes(conn)) return;
  NET.conns = NET.conns.filter(c => c !== conn);
  const slot = conn.slot; LOBBY.players = LOBBY.players.filter(p => p.slot !== slot);
  if (MT.active) { dropPlayer(slot); bcast({ t: 'left', slot }); } else { sendLobby(); renderLobby(); }
}
async function joinTeam() {
  const code = $('jcode').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { status('teamStatus', 'Enter the 6-character team code.', true); return; }
  status('teamStatus', `Joining ${code}…`); $('bJoin').disabled = true;
  netReset();
  // 1) relay
  let mq = null; try { mq = await connectRelay(); } catch (_) {}
  if (mq) {
    const base = TOPIC(code);
    Object.assign(NET, { mode: 'relay', mq, base, code, isHost: false, online: false });
    const onMsg = m => { if (!m || typeof m !== 'object' || NET.mq !== mq && NET.mode !== 'relay') return; NET.lastHost = nowS(); if (!NET.online && m.t === 'lobby') NET.online = true; if (NET.online || m.t === 'full') onGuestData(m); };
    mq.subscribe(base + '/g', onMsg); mq.subscribe(base + '/p/' + myId, onMsg);
    mq.subscribe(base + '/s', m => { if (!m || typeof m !== 'object' || !NET.online) return; if (m.s === 0) NET.lastHost = nowS(); onGuestData(m); });
    mq.onclose = relayDropped;
    for (let k = 0; k < 8 && !NET.online && NET.mq === mq; k++) { mq.publish(base + '/h', { t: 'hello', id: myId, name: myName(), from: myId }); await sleep(1000); }
    if (NET.online || NET.mq !== mq) { $('bJoin').disabled = false; return; }
    status('teamStatus', `Joining ${code}… trying a direct link`);
    netReset();
  }
  // 2) direct WebRTC
  try {
    const Peer = await getPeer();
    const p = new Peer(PEER_PREFIX + 'g-' + myId + genCode().toLowerCase(), { config: ICE, debug: 0 }); NET.peer = p;
    let done = false;
    const fail = e => { if (done) return; done = true; status('teamStatus', netError(e), true); netReset(); $('bJoin').disabled = false; };
    p.on('error', fail);
    const to = setTimeout(() => fail({ type: mq ? 'not-found' : 'network' }), 20000);
    p.on('open', () => {
      const conn = p.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
      conn.on('open', () => { done = true; clearTimeout(to); Object.assign(NET, { mode: 'p2p', hostConn: conn, online: true, code, isHost: false }); conn.send({ t: 'hello', id: myId, name: myName() }); $('bJoin').disabled = false; });
      conn.on('data', onGuestData);
      conn.on('close', hostLost); conn.on('error', hostLost);
    });
  } catch (e) { status('teamStatus', mq ? netError({ type: 'not-found' }) : netError(e), true); netReset(); $('bJoin').disabled = false; }
}
function onGuestData(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'full': status('teamStatus', 'That team is full or already playing.', true); netReset(); $('bJoin').disabled = false; break;
    case 'lobby': { LOBBY.players = m.players; LOBBY.map = m.map; const me = m.players.find(p => p.id === myId); if (me) LOBBY.mySlot = me.slot; if (!MT.active && $('result').hidden) { status('teamStatus', ''); showView('vLobby'); renderLobby(); } break; }
    case 'start': $('result').hidden = true; startMatch(m.map, m.players, true); send({ t: 'ready' }); break;
    case 'round': beginRound(m.n, m.scores, Array.isArray(m.sp) ? m.sp.map(v => clamp(v | 0, 0, SPAWNS.length - 1)) : null); break;
    case 'flag': applyFlag(m); break;
    case 'cap': applyCap(m); break;
    case 'end': showResult(m); break;
    case 'left': dropPlayer(m.slot); break;
    case 'back': $('result').hidden = true; endMatch(); openLobbyMenu(); break;
    case 'st': onState(m); break;

function hostLost() {
  if (!NET.online || NET.isHost) return;
  netReset(); if (MT.active) endMatch(); running = false;
  $('result').hidden = true; $('pause').hidden = true; openMainMenu(); status('homeStatus', 'The team host left the game.', true);
}
setInterval(() => { // relay keep-alive: who is still here
  if (!NET.online || NET.mode !== 'relay') return;
  const t = nowS();
  if (NET.isHost) { for (const c of NET.conns.slice()) if (t - c.seen > 14) guestLeft(c); if (!MT.active) sendLobby(); else bcast({ t: 'hb' }); }
  else { send({ t: 'hb' }); if (NET.lastHost && t - NET.lastHost > 16) hostLost(); }

function hostStart() {
  if (LOBBY.players.length < 2) return;
  for (const c of NET.conns) c.ready = false;

  startMatch(LOBBY.map, LOBBY.players, true);
  const t0 = performance.now();

  if (NET.isHost) bcast({ t: 'closing' }); else send({ t: 'bye' });

// ------------------------------------------------------------------ menus
const VIEWS = ['vHome', 'vSolo', 'vTeam', 'vLobby'];

function hideAllMenus() { $('menu').hidden = true; $('pause').hidden = true; $('result').hidden = true; }

function cleanName(s) { s = String(s || '').replace(/[^\p{L}\p{N} _.-]/gu, '').trim().slice(0, 12); return s || 'Player'; }
function openMainMenu() { running = false; for (const k in input) input[k] = false; document.querySelectorAll('.pad.on').forEach(e => e.classList.remove('on')); if (audio) audio.ctx.suspend(); showView('vHome'); }
function openLobbyMenu() { running = false; for (const k in input) input[k] = false; if (audio) audio.ctx.suspend(); showView('vLobby'); renderLobby(); }
function renderLobby() {
  $('lcode').textContent = NET.code || '------';
  const items = [0, 1, 2, 3].map(s => { const p = LOBBY.players.find(p => p.slot === s); return p ? `<li><i style="background:${SLOT_HEX[s]}"></i>${esc(p.name)}${p.id === myId ? ' (you)' : ''}<em>${s === 0 ? 'HOST' : 'READY'}</em></li>` : `<li class="empty"><i style="background:${SLOT_HEX[s]};opacity:.35"></i>Waiting for a friend…</li>`; });

  document.querySelector('[data-maps="lobby"]').toggleAttribute('data-locked', !NET.isHost);
  $('bStart').hidden = !NET.isHost; $('bStart').disabled = LOBBY.players.length < 2;

}
{ // build map cards
  const tpl = $('mapCards');
  document.querySelectorAll('[data-maps]').forEach(box => box.appendChild(tpl.content.cloneNode(true)));
  document.querySelectorAll('[data-maps="solo"] .map').forEach(b => b.onclick = () => startSolo(b.dataset.map));
  document.querySelectorAll('[data-maps="lobby"] .map').forEach(b => b.onclick = () => { if (!NET.isHost) return; LOBBY.map = b.dataset.map; sendLobby(); renderLobby(); });
}
function startSolo(map) {
  netReset(); const players = [{ id: myId, name: myName(), slot: 0 }];
  startMatch(map, players, false); hostRound(1);
}
try { $('pname').value = localStorage.getItem('sr_name') || ''; } catch (_) {}
$('pname').addEventListener('change', () => { try { localStorage.setItem('sr_name', myName()); } catch (_) {} });
$('bSolo').onclick = () => showView('vSolo');
$('bTeam').onclick = () => { status('teamStatus', ''); showView('vTeam'); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => showView('vHome'));
$('bCreate').onclick = createTeam;
$('bJoin').onclick = joinTeam;
$('jcode').addEventListener('keydown', e => { if (e.key === 'Enter') joinTeam(); });
$('jcode').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
$('bStart').onclick = hostStart;
$('bLeave').onclick = () => { leaveTeam(); showView('vTeam'); status('teamStatus', ''); };
const inviteText = () => `Join my Street Rush team! Open the game, tap TEAM CODE and enter: ${NET.code}`;
$('bCopy').onclick = () => {
  const done = () => status('lstatus', 'Code copied. Send it to your friend.');
  if (window.AndroidBridge && AndroidBridge.copy) { AndroidBridge.copy(NET.code); done(); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(NET.code).then(done, () => status('lstatus', `Your code is ${NET.code}`)); else status('lstatus', `Your code is ${NET.code}`);
};
$('bShare').onclick = () => {
  if (window.AndroidBridge && AndroidBridge.share) { AndroidBridge.share(inviteText()); return; }
  if (navigator.share) navigator.share({ text: inviteText() }).catch(() => {}); else $('bCopy').onclick();
};
function togglePause() {
  if (!MT.active || MT.phase === 'over') return;

$('menuBtn').onclick = togglePause;

applyMap('village'); try { renderer.compile(scene, camera); } catch (_) {}

flag.visible = flagStand.visible = flagBeam.visible = false;
if (location.hash === '#debug') window.__br = { P, M: MT, get obsN() { return obs.length; }, get edgesN() { return edges.length; }, NET, LOBBY, remotes, world, startSolo, hostClaim, get FLAG_HOME() { return FLAG_HOME; }, get bases() { return bases; }, setName: n => { $('pname').value = n; } };
requestAnimationFrame(frame);

function showMenu() { showView('vHome'); $('intro').classList.add('out'); setTimeout(() => { $('intro').hidden = true; }, 600); }
