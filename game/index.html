<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Bridge Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD pinned to safe-area corners, thumb controls at the bottom. Single dark "dashboard glass" look. */
:root{
  --bg:#0a0d12; --fg:#f3f5f7; --muted:#a9b3bf; --accent:#ff7a1a; --glass:rgba(12,16,22,.46); --line:rgba(255,255,255,.22);
  --danger:#ff4a3d; --good:#5fe3a1;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif; --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font-family:var(--display);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#score{top:calc(10px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));font-size:15px;letter-spacing:.06em}
#score b{display:block;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#speedo{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#speedo .v{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#speedo .u{font-size:12px;letter-spacing:.2em;color:var(--muted)}
#speedo .g{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;color:var(--accent)}
#msg{top:28%;left:0;right:0;text-align:center;font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--accent);opacity:0;transition:opacity .25s, transform .25s;transform:scale(.9)}
#msg.on{opacity:1;transform:scale(1)}
#msg small{display:block;font-size:16px;color:var(--fg);letter-spacing:.12em}
#drift{top:36%;left:0;right:0;text-align:center;font-size:20px;color:var(--fg);opacity:0;transition:opacity .2s}
#drift.on{opacity:1}
#topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:44px}
.tb:focus-visible,.pad:focus-visible,#go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#controls{position:fixed;left:0;right:0;bottom:0;height:0}
.pad{position:fixed;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1.5px solid var(--line);color:var(--fg);
  font-family:var(--display);font-weight:700;letter-spacing:.06em;border-radius:50%;width:76px;height:76px;font-size:14px;touch-action:none;padding:0}
.pad.on{background:rgba(255,122,26,.42);border-color:var(--accent)}
.pad svg{width:34px;height:34px;fill:currentColor}
#left{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#right{left:calc(max(16px,env(safe-area-inset-left,0px)) + 88px);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#gas{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:78px;height:118px;border-radius:22px}
#brake{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#hb{right:calc(max(16px,env(safe-area-inset-right,0px)) + 90px);bottom:calc(100px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:12px}
@media (pointer:fine){ #controls{display:none} }
@media (max-width:560px){ #topbtns{flex-direction:column} }
[hidden]{display:none!important}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:linear-gradient(180deg,rgba(6,10,16,.25),rgba(6,10,16,.85));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#start h1{font-family:var(--display);font-size:clamp(40px,11vw,84px);margin:0;letter-spacing:.04em;line-height:.95;text-wrap:balance}
#start h1 span{color:var(--accent)}
#start p{margin:0;max-width:34ch;color:var(--muted);font-size:15px;line-height:1.5}
#go{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;color:#160a02;background:var(--accent);border:0;border-radius:12px;padding:14px 36px;margin-top:6px}
.keys{font-size:12px;color:var(--muted);letter-spacing:.06em}
#loading{font-family:var(--display);color:var(--muted);letter-spacing:.1em}
#flash{position:fixed;inset:0;pointer-events:none;background:var(--danger);opacity:0;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){#msg,#drift,#flash{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="score">SCORE<b id="scoreV">0</b><span id="dist">0.0 km</span></div>
<div class="hud" id="speedo"><div class="v" id="spd">0</div><div class="u">KM/H <span class="g" id="gear">N</span></div></div>
<div class="hud" id="msg"></div>
<div class="hud" id="drift"></div>
<div id="flash"></div>
<div id="topbtns">
  <button class="tb" id="camBtn" type="button" aria-label="Change camera">CAM</button>
  <button class="tb" id="qBtn" type="button" aria-label="Graphics quality">HD</button>
  <button class="tb" id="sndBtn" type="button" aria-label="Sound on or off">SND</button>
</div>
<div id="controls">
  <button class="pad" id="left" type="button" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
  <button class="pad" id="right" type="button" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8L7 18.4 13.8 12 7 5.6z"/></svg></button>
  <button class="pad" id="hb" type="button" aria-label="Handbrake drift">DRIFT</button>
  <button class="pad" id="brake" type="button" aria-label="Brake">BRAKE</button>
  <button class="pad" id="gas" type="button" aria-label="Accelerate">GAS</button>
</div>
<div id="start">
  <h1>BRIDGE<br><span>RUSH</span></h1>
  <p>బ్రిడ్జ్‌లపై స్పీడ్‌గా డ్రైవ్ చేయండి, డ్రిఫ్ట్ చేయండి, ర్యాంప్‌ల మీద జంప్ చేయండి. ట్రాఫిక్‌ను తప్పించుకోండి.</p>
  <div id="loading">LOADING…</div>
  <button id="go" type="button" hidden>START</button>
  <div class="keys">Keyboard: ↑ gas · ↓ brake · ← → steer · Space drift · C camera</div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);

// ------------------------------------------------------------------ textures & materials
const ROAD_W = 26, CH = 144;
const roadTex = canvasTex(512, 512, (x, w, h) => {

const concreteTex = canvasTex(128, 128, (x, w, h) => { x.fillStyle = '#b4b1aa'; x.fillRect(0, 0, w, h); noise(x, w, h, 26); });

    x.fillStyle = '#f5f5f5'; x.font = 'bold 58px Arial, sans-serif'; x.textAlign = 'center'; x.fillText(top, w / 2, 82);

const M = {
  road: new THREE.MeshStandardMaterial({ map: roadTex, roughness: .88, metalness: 0 }),
  concrete: new THREE.MeshStandardMaterial({ map: concreteTex, color: 0xd8d4cc, roughness: .9 }),
  deck: new THREE.MeshStandardMaterial({ color: 0x8d8a84, roughness: .95 }),
  red: new THREE.MeshStandardMaterial({ color: 0xa3352b, roughness: .55, metalness: .35 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x6f7d78, roughness: .5, metalness: .45 }),
  pole: new THREE.MeshStandardMaterial({ color: 0x9aa1a6, roughness: .45, metalness: .6 }),
  ramp: new THREE.MeshStandardMaterial({ color: 0xe1a51c, roughness: .55, metalness: .2 }),
  water: new THREE.MeshStandardMaterial({ color: 0x174a66, roughness: .12, metalness: .05, normalMap: waterNormal, normalScale: new THREE.Vector2(.35, .35) }),
  sign1: new THREE.MeshStandardMaterial({ map: signTex('BAYVIEW', 'EXIT 2 km'), roughness: .5, emissive: 0x0a2a16, emissiveIntensity: .25 }),
  sign2: new THREE.MeshStandardMaterial({ map: signTex('HARBOR CITY', 'KEEP RIGHT'), roughness: .5, emissive: 0x0a2a16, emissiveIntensity: .25 }),

// ------------------------------------------------------------------ world templates

  else if (game.driftT > 0) { game.driftT -= dt; if (game.driftT <= 0) { if (game.drift > 150) { game.score += Math.round(game.drift); popup('DRIFT', `+${Math.round(game.drift)}`); } game.drift = 0; hud.drift.classList.remove('on'); } }

    if (intensity > 0) {

  gear = 1; while (gear < GEARS.length - 1 && Math.abs(vF) > GEARS[gear]) gear++;

}

function updateTraffic(dt) {
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  for (const t of traffic) {

    let target = t.base;

    if (lf > 6) t.passed = false;

    const c = t.car; c.root.position.set(t.x, t.y, t.z);
    for (const w of c.wheels) w.spin.rotation.x -= t.v * dt / .347;
    if (t.wreck) { c.root.rotation.set(t.rx, t.ry, t.rz); c.body.rotation.x = 0; c.shadow.visible = up > .85; c.shadow.position.y = .03 - t.y; continue; }
    c.root.rotation.y = -t.vx * .03;

}

// ------------------------------------------------------------------ camera
const camPos = new THREE.Vector3(2, 3, -22), camLook = new THREE.Vector3(), _camT = new THREE.Vector3();

function updateCamera(dt, speed) {

    camPos.y = lerp(camPos.y, Math.max(P.y * .75, 0) + h + (P.air ? .8 : 0), 1 - Math.exp(-5 * dt));
    camLook.set(P.x + fx * 3, P.y + .9, P.z + fz * 3);

  const op = clamp((speed - 38) / 45, 0, .35); lineMat.opacity = op; speedLines.visible = op > 0.01;
  if (speedLines.visible) {
    const len = speed * .05;
    for (let i = 0; i < LINES; i++) { const l = lineData[i]; l.z += speed * dt * 1.6; if (l.z > -2) l.z = -55 - Math.random() * 10;
      const o = i * 6; linePos[o] = linePos[o + 3] = l.x; linePos[o + 1] = linePos[o + 4] = l.y; linePos[o + 2] = l.z; linePos[o + 5] = l.z - len; }
    lineGeo.attributes.position.needsUpdate = true;

}

// ------------------------------------------------------------------ main loop
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const aspect = w / h; camera.aspect = aspect;
  baseFov = aspect >= 1 ? 58 : clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36)) / aspect)), 58, 84);
  camera.fov = baseFov; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
setQuality(quality);

let running = false, last = performance.now(), fpsAcc = 0, fpsN = 0, playT = 0, frameNo = 0;
let distShown = -1, hudT = 0;
const setText = (el, v) => { v = String(v); if (el._v !== v) { el._v = v; el.textContent = v; } };
function step(dt) {
  const r = updatePlayer(dt);
  updateTraffic(dt);
  updateChunks(P.z);
  updateSmoke(dt);
  updateShards(dt);
  // car transforms
  hero.root.position.set(P.x, P.y, P.z); hero.root.rotation.y = P.yaw;
  hero.body.rotation.set(P.pitch, 0, P.roll); hero.body.position.y = P.susp;
  for (const w of hero.wheels) { w.spin.rotation.x = -P.wheel * (w.pivot.scale.x < 0 ? 1 : 1); if (w.front) w.pivot.rotation.y = -P.steer * .45 * (w.pivot.scale.x < 0 ? -1 : 1); }
  hero.shadow.position.y = gnd.h - P.y + .03; hero.shadow.material.opacity = clamp(.8 - (P.y - gnd.h) * .08, .15, .8);
  hero.tailMat.emissiveIntensity = input.brake ? 4 : 1.2;
  // world follow
  sun.position.set(P.x + sunDir.x * 120, P.y + sunDir.y * 120, P.z + sunDir.z * 120 - 15); sun.target.position.set(P.x, P.y, P.z - 15);
  water.position.x = P.x; water.position.z = P.z;
  waterNormal.offset.set((P.x / 5000 * 60 + playT * .004) % 1, (-P.z / 5000 * 60 + playT * .006) % 1);
  const off = -0.15 * P.z; scenery.position.z = P.z + (off - PERIOD * Math.round(off / PERIOD));
  sky.position.copy(camera.position);
  updateCamera(dt, r.speed);
  // score & hud
  game.dist = Math.max(game.dist, (game.startZ - P.z) / 1000);
  if (!P.air && r.speed > 5) game.score += r.speed * dt * .5;
  setText(hud.spd, Math.round(Math.abs(r.vF) * 3.6));
  setText(hud.gear, r.vF < -0.5 ? 'R' : r.speed < .5 ? 'N' : gear);
  hudT -= dt; if (hudT <= 0) { hudT = .15; setText(hud.score, Math.floor(game.score).toLocaleString('en-US')); }
  const ds = Math.floor(game.dist * 10); if (ds !== distShown) { distShown = ds; hud.dist.textContent = (ds / 10).toFixed(1) + ' km'; }
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) hud.msg.classList.remove('on'); }

    audio.o1.frequency.setTargetAtTime(f, t, .04); audio.o2.frequency.setTargetAtTime(f * .5, t, .04);
    audio.lp.frequency.setTargetAtTime(380 + rpm * (input.gas ? 2200 : 1100), t, .05);
    audio.eg.gain.setTargetAtTime(input.gas ? .12 : .07, t, .1);
    audio.screech.gain.setTargetAtTime(r.drifting ? .06 + r.intensity * .12 : 0, t, .05);

}
function frame(now) {

  if (dt > .1) dt = .1;
  if (running) {
    playT += dt;
    const ts = game.slow > 0 ? .35 : 1; if (game.slow > 0) game.slow -= dt;
    const n = dt > 1 / 50 ? 2 : 1; for (let i = 0; i < n; i++) step(dt * ts / n);
    // adaptive quality: after warmup, drop one level if the frame rate is poor
    // dynamic resolution: keep ~60 fps by trading pixels first, then effects
    if (playT > 1.5) { fpsAcc += dt; fpsN++;

        if (fps < 50) {
          if (pr > prMin + .01) { pr = Math.max(prMin, pr - (fps < 38 ? .2 : .1)); renderer.setPixelRatio(pr); resize(); }
          else if (quality > 0 && fps < 42) { setQuality(quality - 1); popup('SMOOTH MODE', 'graphics lowered to remove lag'); }
        } else if (fps > 58 && pr < prMax - .01) { pr = Math.min(prMax, pr + .05); renderer.setPixelRatio(pr); resize(); }
      } }
  } else {
    // idle orbit behind the start screen
    playT += dt * .3;
    const a = playT * .6;
    camera.position.set(P.x + Math.sin(a) * 7, 1.6, P.z + Math.cos(a) * 7); camera.lookAt(P.x, .7, P.z);
    sky.position.copy(camera.position);
  }

}

// initial state
updateChunks(P.z);
for (const t of traffic) spawnTraffic(t, P.z - 80);
hero.root.position.set(P.x, P.y, P.z);
sun.position.set(P.x + sunDir.x * 120, sunDir.y * 120, P.z + sunDir.z * 120); sun.target.position.set(P.x, 0, P.z);
updateTraffic(0);
{ const tmp = [];
  for (const k of ['truss', 'susp']) { const g = new THREE.Group(); g.position.z = P.z - 40; for (const [geo, m, c, r] of TPL[k]) { const x = new THREE.Mesh(geo, m); x.castShadow = c; x.receiveShadow = r; g.add(x); } scene.add(g); tmp.push(g); }

$('loading').hidden = true; $('go').hidden = false;
$('go').onclick = () => {

  camPos.set(P.x, 3, P.z + 8);

</script>
